<div class="text-white rounded h3 d-flex align-items-center justify-content-between bg-darkblue">
    <div>
        Repture de stock
    </div>
    <button class="btn bg-orange" style="border:1px solid var(--orange);" onclick="forceupdatetab('addlistbonachat', '/products/listbonachat?facture={% if facturesection %}1{% endif %}')">↻</button>
</div>
<div class="d-flex justify-content-between align-items-center bg-darkblue text-white p-2">
    <p class="m-0">Filtere par</p>
    <div>
        <select class="form-select form-select-sm" id="filtercategory" onchange="filterlowstockproducts()">
            <option value="">Catégories</option>
            {% for category in categories %}
            <option value="{{ category.id }}">{{ category.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div>
        <select class="form-select form-select-sm" id="filterfournisseur" onchange="filterlowstockproducts()">
            <option value="">Fournisseirs</option>
            {% for f in suppliers %}
            <option value="{{ f.id }}">{{ f.name }}</option>
            {% endfor %}
        </select>
    </div>
    <div>
        <button class="btn btn-sm text-white bi bi-download" onclick="printTable()">Imprimer</button>
    </div>
</div>
<table class="table table-striped table-bordered table-sm">
    <thead>
        <tr>
            <th>Réf</th>
            <th>designation</th>
            <th>Catégorie</th>
            <th>Fournisseur</th>
            <th>Marque</th>
            <th>Stock</th>
            <th>Min stock</th>
            <th></th>
        </tr>
    </thead>
    <tbody>
        {% for product in products %}
        <tr>
            <td>{{ product.ref }}</td>
            <td>{{ product.name }}</td>
            <td data-category_id="{{ product.category.id }}">{{ product.category.name }}</td>
            <td data-fournisseur_id="{{ product.supplier.id }}">{{ product.supplier.name }}</td>
            <td>{{ product.mark }}</td>
            <td>{{ product.stocktotal }}</td>
            <td>{{ product.minstock }}</td>
            <td>
                <button class="btn btn-sm btn-danger" onclick="$(this).closest('tr').remove()">Supprimer</button>
            </td>
        </tr>
        {% endfor %}
</table>
<script>
    // print table in a new window
    function printTable() {
        table = document.querySelector('table').outerHTML;
        var newWin = window.open('about:blank', '', 'width=900,height=900');
        newWin.document.write("<html><head><link rel='stylesheet' type='text/css' href='/static/css/bootstrap.css'><title>Repture de stock</title></head><body>");
        newWin.document.write("<h1>Repture de stock</h1>");
        newWin.document.write(table);
        newWin.document.write("</body></html>");
        newWin.focus();
        
        
        
    }
    // function filterlowstockproducts will filter the products by category and supplier in the UI not by sending request to the server
    function filterlowstockproducts() {
        category=$('#filtercategory').val();
        fournisseur=$('#filterfournisseur').val();
        console.log('filterlowstockproducts', category, fournisseur);
        $('table tbody tr').each(function() {
            var row = $(this);
            var rowCategory = row.find('td:nth-child(2)').data('category_id');
            var rowFournisseur = row.find('td:nth-child(3)').data('fournisseur_id');
            if (category === "" && fournisseur !== "") {
                row.show();
                if (rowFournisseur != fournisseur) {
                    row.hide();
                }
            } else if (category !== "" && fournisseur === "") {
                row.show();
                if (rowCategory != category) {
                    row.hide();
                }
            } else if (category !== "" && fournisseur !== "") {
                row.show();
                if (rowCategory != category || rowFournisseur != fournisseur) {
                    row.hide();
                }
            } else {
                row.show();
            }
        });
    }
</script>
